name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug, Audit]   # Audit = instrumented -O2 build

    steps:
    - uses: actions/checkout@v4

    - name: Install Compiler
      run: |
        # The runner image ships a Microsoft apt source whose InRelease for
        # the current Ubuntu release is unsigned; apt-get update then exits
        # 100 and takes the whole job down. We need nothing from it, so
        # drop it before updating. See the same note in the lint job.
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list \
                   /etc/apt/sources.list.d/microsoft-*.sources
        sudo apt-get update
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          sudo apt-get install -y g++-13
        else
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev libunwind-dev
          sudo apt-get install -y libunwind-18-dev || true
        fi

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
        -DHFT_WERROR=ON
        ${{ matrix.compiler == 'clang' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }} -j$(nproc)

    - name: "Test (ctest)"
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure

    # The engine is exception-free (fault handlers, never throw), so the
    # libc++ exception-string path that originally tripped ASan's
    # alloc_dealloc_mismatch check is no longer reached. No suppression is
    # set anywhere in this workflow — the gcc leg below re-runs the binary
    # with a clean environment to prove none is needed.
    - name: Test (plain binary, no suppression env)
      if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
      working-directory: ${{github.workspace}}/build
      run: ./hft_tests

    # Engine smoke — a crash in main.cpp (e.g. an mlockall/bad_alloc
    # failure) must never ship green.
    - name: Smoke-run engine (Release/Audit)
      if: matrix.build_type != 'Debug'
      working-directory: ${{github.workspace}}/build
      run: HFT_DISABLE_MLOCKALL=1 timeout 120 ./hft_engine

    - name: Smoke-run simulation (Release only, 200k events)
      if: matrix.build_type == 'Release'
      working-directory: ${{github.workspace}}/build
      run: timeout 180 ./hft_sim 200000

    - name: RDTSC harness smoke (Release only)
      if: matrix.build_type == 'Release'
      working-directory: ${{github.workspace}}/build
      run: timeout 120 ./hft_rdtsc_bench

    - name: Benchmark (Release only)
      if: matrix.build_type == 'Release'
      working-directory: ${{github.workspace}}/build
      run: ./hft_bench --benchmark_min_time=0.1s

  # The repo ships .clang-tidy / .clang-format — run them.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install tooling
      run: |
        # The runner image ships a Microsoft apt source whose InRelease for
        # the current Ubuntu release is unsigned; apt-get update then exits
        # 100 and takes the whole job down. We need nothing from it, so
        # drop it before updating. See the same note in the build job.
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list \
                   /etc/apt/sources.list.d/microsoft-*.sources
        sudo apt-get update
        sudo apt-get install -y clang-18 clang-tidy-18 clang-format-18
    - name: clang-format check
      run: |
        find src tests tools -name '*.cpp' -o -name '*.h' | xargs clang-format-18 --dry-run --Werror
    - name: clang-tidy (src/ only; third-party excluded)
      run: |
        cmake -B build-tidy -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-18
        cmake --build build-tidy --target hft_engine -- -j$(nproc)
        clang-tidy-18 -p build-tidy src/*.cpp --warnings-as-errors='*'

  # Run the same end-to-end pipeline the owner runs locally
  # (scripts/run_all.sh) — 11 phases: env, build (5 flavors), tests, fuzz,
  # valgrind, static, bench, rdtsc, sim, smoke (incl. the gVisor self-heal
  # simulation), summary. The verify-results bundle is uploaded on every run.
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pipeline tools
      run: |
        # The runner image ships a Microsoft apt source whose InRelease for
        # the current Ubuntu release is unsigned; apt-get update then exits
        # 100 and takes the whole job down. We need nothing from it, so
        # drop it before updating. See the same note in the build job.
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list \
                   /etc/apt/sources.list.d/microsoft-*.sources
        sudo apt-get update
        sudo apt-get install -y valgrind cppcheck clang-18 clang-tidy-18 clang-format-18
        # run_all.sh looks up plain names; Debian suffixes -18
        sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
        sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
        sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
    - name: Full verification pipeline (quick mode)
      run: |
        chmod +x scripts/*.sh
        FAST=1 ./scripts/run_all.sh
    - name: Upload verify-results bundle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verify-results
        path: verify-results/
