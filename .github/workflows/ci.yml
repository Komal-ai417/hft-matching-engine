name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Install Compiler
      run: |
        sudo apt-get update
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          sudo apt-get install -y g++-13
        else
          # Install Clang 18 from official LLVM repo for full C++23 support
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev
        fi

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
        ${{ matrix.compiler == 'clang' && '-DCMAKE_CXX_FLAGS="-stdlib=libc++"' || '' }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }} -j$(nproc)

    - name: Test (Google Test)
      working-directory: ${{github.workspace}}/build
      run: ASAN_OPTIONS=alloc_dealloc_mismatch=0 ./hft_tests

    - name: Benchmark (Release only)
      if: matrix.build_type == 'Release'
      working-directory: ${{github.workspace}}/build
      run: ./hft_bench --benchmark_min_time=0.1s
